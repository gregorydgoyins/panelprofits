services:
  - type: web
    name: panel-profits
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DIRECT_URL
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false
      - key: GPA_INGESTION_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
