name: Daily PriceCharting Ingestion Worker

on:
  schedule:
    # Runs at 02:00 UTC daily (after US auction hammer closes)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ingest:
    name: Run Automated PriceCharting Market Feed Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: panel-profits/package-lock.json

      - name: Install Dependencies
        working-directory: ./panel-profits
        run: npm ci

      - name: Execute Daily PriceCharting Ingestion
        working-directory: ./panel-profits
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRICECHARTING_API_TOKEN: ${{ secrets.PRICECHARTING_API_TOKEN }}
        run: npx tsx scripts/pricecharting-nightly-cloud.mjs
